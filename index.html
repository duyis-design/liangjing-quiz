 "吴不平":{line:"你话最少，扛得最多。",tags:["沉默","隐忍","可靠"],stars:4,

 "林不平":{line:"你见不得不平，哪怕吃亏的是自己。",tags:["热血","直","不平则鸣"],stars:4,
  persona:"直、热、藏不住事。看到不对的，你不上前就难受。",

  best:"吴定缘、于谦",worst:"汪极",
  quote:"「这事儿，我管定了。」",style:"工装 + 运动 + 亮色点缀 + 干净球鞋。",color:"#C0392B"}
};

var ORDER = ["朱瞻基","吴定缘","苏荆溪","于谦","昨叶何","朱高煦","张皇后","吴玉露","吴不平","汪极","郑和","林不平"];

/* ================= 逻辑 ================= */
var idx = 0;
var answers = new Array(QUESTIONS.length).fill(null);
var current = null;

function $(id){return document.getElementById(id)}
function show(id){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active")});
  $(id).classList.add("active");
  window.scrollTo(0,0);
}

function renderQ(){
  var q = QUESTIONS[idx];
  $("qnum").textContent = String(idx+1).padStart(2,"0") + " / " + QUESTIONS.length;
  $("qtext").textContent = q.q;
  $("bar").style.width = (idx/QUESTIONS.length*100) + "%";
  $("back").disabled = idx === 0;
  $("skipHint").style.opacity = answers[idx] === null ? .55 : 0;
  var box = $("opts");
  box.innerHTML = "";
  q.o.forEach(function(opt,i){
    var b = document.createElement("button");
    b.className = "opt" + (answers[idx] === i ? " on" : "");
    b.innerHTML = '<span class="letter">' + "ABCD"[i] + '</span><span class="txt">' + opt[0] + "</span>";
    b.onclick = function(){ pick(i); };
    box.appendChild(b);
  });
}

function pick(i){
  answers[idx] = i;
  document.querySelectorAll(".opt").forEach(function(el,j){
    el.classList.toggle("on", j === i);
  });
  setTimeout(function(){
    if(idx < QUESTIONS.length - 1){ idx++; renderQ(); }
    else { finish(); }
  }, 180);
}

$("start").onclick = function(){ idx = 0; answers = new Array(QUESTIONS.length).fill(null); renderQ(); show("s-quiz"); };
$("back").onclick = function(){ if(idx>0){ idx--; renderQ(); } };
$("again").onclick = function(){ idx = 0; answers = new Array(QUESTIONS.length).fill(null); show("s-intro"); };

function compute(){
  var cnt = {};
  ORDER.forEach(function(k){ cnt[k] = 0; });
  answers.forEach(function(a,i){ if(a !== null) cnt[QUESTIONS[i].o[a][1]]++; });
  var arr = ORDER.map(function(k){ return {k:k, v:cnt[k]}; })
                 .sort(function(a,b){ return b.v - a.v || ORDER.indexOf(a.k) - ORDER.indexOf(b.k); });
  var top = arr[0].v;
  var tied = arr.filter(function(x){ return x.v === top; }).map(function(x){ return x.k; });
  var main = tied[0];
  if(tied.length > 1){
    [0,8,16].forEach(function(qi){ /* 已在下方处理 */ });
    for(var n=0; n<3; n++){
      var qi = [0,8,16][n];
      var a = answers[qi];
      if(a === null) continue;
      var c = QUESTIONS[qi].o[a][1];
      if(tied.indexOf(c) >= 0){ main = c; break; }
    }
  }
  var second = arr.filter(function(x){ return x.k !== main && x.v > 0; })[0] || null;
  return {main:main, second:second, count:top, tied:tied.length>1};
}

function finish(){
  var r = compute();
  current = r;
  var c = CHARS[r.main];
  $("hero").style.setProperty("--c", c.color);
  $("rname").textContent = r.main;
  $("rstars").textContent = "★".repeat(c.stars) + "☆".repeat(5-c.stars);
  $("rline").textContent = c.line;
  $("rtags").innerHTML = c.tags.map(function(t){ return '<span class="tag">'+t+"</span>"; }).join("");
  $("rpersona").textContent = c.persona;
  $("rhigh").textContent = c.high;
  $("rweak").textContent = c.weak;
  $("rbest").textContent = c.best;
  $("rworst").textContent = c.worst;
  $("rquote").textContent = c.quote;
  $("rstyle").textContent = c.style;
  $("rkicker").textContent = "“" + c.line + "”";
  if(r.second){
    $("rsecond").innerHTML = "你的另一面更像 <b>" + r.second.k + "</b><br><span style=\"opacity:.75\">" + CHARS[r.second.k].line + "</span>";
  } else {
    $("rsecond").textContent = "";
  }
  show("s-result");
}

$("copy").onclick = function(){
  if(!current) return;
  var c = CHARS[current.main];
  var txt = "我在《两京十五日》角色测试里，测出来是——" + current.main + "\n"
          + "「" + c.line + "」\n"
          + "你是哪一个？ " + location.href;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("已复制，去粘贴吧"); }, function(){ fallbackCopy(txt); });
  } else { fallbackCopy(txt); }
};
function fallbackCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制"); }catch(e){ toast("复制失败，请手动选择"); }
  document.body.removeChild(ta);
}
function toast(msg){
  var d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:fixed;left:50%;bottom:38px;transform:translateX(-50%);background:#221E19;color:#F6F0E4;padding:10px 18px;border-radius:99px;font-size:13px;z-index:99";
  document.body.appendChild(d);
  setTimeout(function(){ d.style.transition="opacity .4s"; d.style.opacity="0"; }, 1200);
  setTimeout(function(){ d.remove(); }, 1700);
}

/* ================= 分享卡 ================= */
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  var line = "";
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    var test = line + ch;
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, y); line = ch; y += lineHeight;
    } else { line = test; }
  }
  if(line){ ctx.fillText(line, x, y); y += lineHeight; }
  return y;
}

$("share").onclick = function(){
  if(!current) return;
  var c = CHARS[current.main];
  var W = 1080, H = 1440;
  var cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  var ctx = cv.getContext("2d");

  ctx.fillStyle = "#F6F0E4"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "rgba(34,30,25,.035)";
  for(var x=0;x<W;x+=22){ for(var y=0;y<H;y+=22){ ctx.fillRect(x,y,1.4,1.4); } }

  ctx.fillStyle = c.color; ctx.fillRect(0,0,W,14);

  ctx.fillStyle = "#7B7266";
  ctx.font = '30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText("《两京十五日》角色测试", 90, 168);

  ctx.fillStyle = "#221E19";
  ctx.font = 'bold 126px "Songti SC","STSong","SimSun",serif';
  ctx.fillText(current.main, 86, 356);

  ctx.fillStyle = "#B03A2E";
  ctx.font = '38px sans-serif';
  ctx.fillText("★".repeat(c.stars) + "☆".repeat(5-c.stars), 92, 414);

  ctx.fillStyle = c.color; ctx.fillRect(90, 466, 120, 4);

  ctx.fillStyle = "#33291F";
  ctx.font = '50px "Songti SC","STSong","SimSun",serif';
  var y = wrapText(ctx, c.line, 90, 566, 880, 74);

  y += 36;
  ctx.fillStyle = "#7B7266";
  ctx.font = '30px "PingFang SC","Microsoft YaHei",sans-serif';
  c.tags.forEach(function(t,i){ ctx.fillText("#" + t, 90 + i*212, y); });

  y += 88;
  ctx.fillStyle = "#B03A2E";
  ctx.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText("你 的 高 光", 90, y);

  y += 52;
  ctx.fillStyle = "#3A3027";
  ctx.font = '40px "PingFang SC","Microsoft YaHei",sans-serif';
  y = wrapText(ctx, c.high, 90, y, 900, 58);

  y += 44;
  ctx.fillStyle = "#B03A2E";
  ctx.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText("现 代 版 穿 搭", 90, y);

  y += 52;
  ctx.fillStyle = "#3A3027";
  ctx.font = '36px "PingFang SC","Microsoft YaHei",sans-serif';
  y = wrapText(ctx, c.style, 90, y, 900, 54);

  var divY = Math.max(y + 50, 1150);
  ctx.strokeStyle = "#DED3C0"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(90, divY); ctx.lineTo(990, divY); ctx.stroke();

  ctx.fillStyle = "#221E19";
  ctx.font = '40px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText("测测你是哪个角色", 90, divY + 78);
  ctx.fillStyle = "#7B7266";
  ctx.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText("24 题 · 12 个角色 · 6 分钟", 90, divY + 124);
  ctx.fillText("同人向娱乐测试 · 非官方", 90, divY + 166);

  var url = cv.toDataURL("image/png");
  $("cardimg").src = url;
  $("dl").href = url;
  $("modal").classList.add("on");
};
$("close").onclick = function(){ $("modal").classList.remove("on"); };
$("modal").onclick = function(e){ if(e.target === $("modal")) $("modal").classList.remove("on"); };
</script>
